
name: Build Duel Editor AI for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --name DuelEditorAI `
            --collect-all streamlit `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all av `
            --collect-all tokenizers `
            --collect-all imageio_ffmpeg `
            --copy-metadata streamlit `
            --copy-metadata faster-whisper `
            --copy-metadata ctranslate2 `
            --add-data "app.py;." `
            launcher.py

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/DuelEditorAI/*" -DestinationPath "dist/DuelEditorAI-Windows-Portable.zip" -Force

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DuelEditorAI-Windows-Portable
          path: dist/DuelEditorAI-Windows-Portable.zip
          retention-days: 14
